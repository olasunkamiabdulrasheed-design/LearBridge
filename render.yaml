# Render Blueprint for the LearnBridge API.
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo (uses main branch).
#
# NOTE: This blueprint does NOT create a database. It reuses an existing Render
# Postgres (free accounts allow only one). Paste the connection string into the
# DATABASE_URL prompt at blueprint creation, or set it later in the dashboard.
#
# CORS/CSRF values below are set to the live Vercel + Render URLs.

services:
  - type: web
    name: learnbridge-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: backend
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Leading dot matches any *.onrender.com subdomain (service name may vary).
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Vercel frontend origin(s), comma-separated.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://lear-bridge.vercel.app"
      # Public API URL (Django admin/session over HTTPS).
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://learnbridge-api-bhu1.onrender.com"
      # Existing Render Postgres connection string. Paste at blueprint creation
      # (Internal URL if the web service is in the same region, else External).
      - key: DATABASE_URL
        sync: false
      # --- Study Agent (optional; empty keys = deterministic local mode) ---
      - key: AGENT_ENABLED
        value: "True"
      - key: AGENT_MAX_STEPS
        value: "12"
      - key: AGENT_TIMEOUT_SECONDS
        value: "120"
      - key: AGENT_ALLOW_WEB
        value: "False"
      - key: LEARNBRIDGE_LLM_PROVIDER
        value: "none"
      - key: LEARNBRIDGE_SEARCH_PROVIDER
        value: "catalog"
      # Set these in the dashboard (sync: false keeps them out of git).
      - key: LEARNBRIDGE_LLM_API_KEY
        sync: false
      - key: LEARNBRIDGE_LLM_BASE_URL
        sync: false
      - key: LEARNBRIDGE_LLM_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
